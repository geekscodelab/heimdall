[project]
name = "heimdall"
version = "0.1.0"
description = "Authentication & Authorization Service"
authors = [
    { name = "Milad Moslehikhou",  email="milad.moslehikhou@gmail.com"},
    { name = "Hesam Ghasemi",  email="s.hesam.ghasemi@gmail.com"}
]
license = { text = "MIT License" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django (==4.2.17)",
    "djangorestframework (==3.15.2)",
    "drf-spectacular (==0.28.0)",
    "django-rest-knox (==5.0.2)",
    "pillow (==11.1.0)",
    "cryptography (>=44.0.0,<45.0.0)",
]

[tool.poetry]

[tool.poetry.group.dev.dependencies]
ruff = "^0.9.1"
pre-commit = "^4.0.1"
commitizen = "^4.1.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
exclude = [
    ".git",
    ".git-rewrite",
    ".mypy_cache",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "venv",
]
line-length = 120
indent-width = 4

[tool.ruff.lint]
ignore = [
    "E203",  # Whitespace before ':'
]
fixable = ["ALL"]
extend-select = ["I"]  # Enable isort-style import sorting

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.commitizen]
name = "cz_conventional_commits"  
version = "0.1.0"
tag_format = "v$version"
