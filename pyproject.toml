[project]
name = "heimdall"
version = "0.1.0"
description = "Authentication & Authorization Service"
authors = [
    { name = "Milad Moslehikhou",  email="milad.moslehikhou@gmail.com"},
    { name = "Hesam Ghasemi",  email="s.hesam.ghasemi@gmail.com"}
]
license = { text = "MIT License" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django (==4.2.17)",
    "djangorestframework (==3.15.2)",
    "drf-spectacular (==0.28.0)",
    "django-rest-knox (==5.0.2)",
    "pillow (==11.1.0)",
]

[tool.poetry]

[tool.poetry.group.dev.dependencies]
autopep8 = "2.3.1"
flake8 = "7.1.1"
isort = "5.13.2"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.autopep8]
max_line_length = 120
ignore = ""
in-place = true
recursive = true
aggressive = 2
